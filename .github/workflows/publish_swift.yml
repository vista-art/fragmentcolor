name: Publish Swift Package

# Checks a published release against its Swift Package Manager pin.
# Swift Package Manager has no registry: consumers resolve the git tag and
# download the xcframework from the URL and checksum in its `Package.swift`.
# `prepare_release.yml` builds that xcframework, attaches it to the draft
# release, and commits the pin that the tag points at. This workflow never
# rebuilds, because a rebuilt static library would not match the pinned checksum.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to check (vX.Y.Z)"
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    steps:
      - name: Determine tag
        id: vars
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.vars.outputs.tag }}

      - name: Compare the release asset with the Package.swift pin
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n -E 's/^let fragmentcolorVersion = "(.*)"$/\1/p' Package.swift)
          PINNED=$(sed -n -E 's/^let fragmentcolorChecksum = "(.*)"$/\1/p' Package.swift)
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Package.swift at $TAG pins the v$VERSION xcframework. Start releases with the Prepare release workflow."
            exit 1
          fi
          gh release download "$TAG" --pattern FragmentColorFFI.xcframework.zip --dir "$RUNNER_TEMP/xcf"
          ACTUAL=$(swift package compute-checksum "$RUNNER_TEMP/xcf/FragmentColorFFI.xcframework.zip")
          if [ "$ACTUAL" != "$PINNED" ]; then
            echo "::error::The $TAG xcframework asset has checksum $ACTUAL, but Package.swift pins $PINNED."
            exit 1
          fi
          echo "Package.swift at $TAG matches the attached xcframework ($ACTUAL)."

      # Resolves the binary target from the release URL, as a consumer would.
      - name: Build the package for the iOS Simulator
        run: |
          xcodebuild -scheme FragmentColor \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            build
