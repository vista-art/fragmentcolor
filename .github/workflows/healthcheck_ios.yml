name: Healthcheck iOS (Swift)

on:
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.*'
      - 'build.rs'
      - 'scripts/**'
      - 'platforms/swift/**'
      - 'docs/api/**'
      - 'uniffi.toml'
      - 'tools/**'
      - '.github/workflows/healthcheck_ios.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  healthcheck-ios:
    # macos-14 is ARM64 with Xcode 15 preinstalled.
    runs-on: macos-14
    env:
      # sccache interacts poorly with cross-compilation to iOS targets;
      # disable it for this job even if it's enabled elsewhere.
      RUSTC_WRAPPER: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Setup Rust (with iOS targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-directories: ${{ github.workspace }}/build
          cache-all-crates: true

      - name: Build xcframework + regenerate Swift bindings
        run: |
          chmod +x ./tools/build_ios
          ./tools/build_ios

      - name: Run Swift healthcheck on iOS simulator
        env:
          FC_HEALTHCHECK_VERBOSE: "1"
        run: |
          chmod +x ./tools/healthcheck
          ./tools/healthcheck ios

      # Swift Package Manager compiles the committed wrapper straight from the
      # release tag, so it has to match what build_ios generates from this commit.
      - name: Check the committed Swift wrapper is current
        if: ${{ !cancelled() }}
        run: |
          GENERATED=platforms/swift/Sources/FragmentColor/generated
          if [ -n "$(git status --porcelain -- "$GENERATED")" ]; then
            git status --short -- "$GENERATED"
            git diff --stat -- "$GENERATED"
            echo "::error::$GENERATED is out of date. Run ./fc build_ios and commit the result, or commit the copy in this run's swift-bindings artifact."
            exit 1
          fi

      - name: Upload generated Swift bindings (for inspection)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-bindings
          path: platforms/swift/Sources/FragmentColor/generated/
          if-no-files-found: warn
