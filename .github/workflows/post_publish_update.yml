name: Post-publish bump consumers

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-consumers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Determine version from event/tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "release" ] && [ -n "${{ github.event.release.tag_name }}" ]; then
            RAW="${{ github.event.release.tag_name }}"
          else
            RAW="${GITHUB_REF##*/}"
          fi
          VERSION="${RAW#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Wait for registries (npm, PyPI)
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          echo "Waiting for npm and PyPI to serve the release..."
          # The PyPI wheel matrix can take ~30 min to land, so wait up to
          # 40 min (240 × 10s) before giving up.
          OK=0
          for i in $(seq 1 240); do
            NPM_OK=0; PYPI_OK=0
            if npm view "fragmentcolor@$VERSION" version >/dev/null 2>&1; then NPM_OK=1; fi
            if curl -sSf "https://pypi.org/pypi/fragmentcolor/$VERSION/json" >/dev/null 2>&1; then PYPI_OK=1; fi
            if [ "$NPM_OK" = "1" ] && [ "$PYPI_OK" = "1" ]; then echo "OK"; OK=1; break; fi
            echo "Not available yet (npm=$NPM_OK pypi=$PYPI_OK), retrying in 10s... ($i/240)"; sleep 10
          done
          if [ "$OK" != "1" ]; then
            echo "::error::Timed out after 40 min waiting for registries (npm=$NPM_OK pypi=$PYPI_OK). Re-run this workflow once the publish jobs have all finished."
            exit 1
          fi

      - name: Copy the Package.swift pin from the release tag
        id: swift_pin
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          # prepare_release.yml committed the pin on the commit the tag points at.
          git fetch --depth=1 origin "refs/tags/v$VERSION:refs/tags/v$VERSION"
          TAGGED=$(git show "v$VERSION:Package.swift")
          PIN_VERSION=$(sed -n -E 's/^let fragmentcolorVersion = "(.*)"$/\1/p' <<< "$TAGGED")
          CHECKSUM=$(sed -n -E 's/^let fragmentcolorChecksum = "(.*)"$/\1/p' <<< "$TAGGED")
          if [ "$PIN_VERSION" != "$VERSION" ] || [ -z "$CHECKSUM" ]; then
            echo "::error::Package.swift at v$VERSION pins version '$PIN_VERSION'. Start releases with the Prepare release workflow."
            exit 1
          fi
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"
          sed -i "s/^let fragmentcolorVersion = \".*\"$/let fragmentcolorVersion = \"${VERSION}\"/" Package.swift
          sed -i "s/^let fragmentcolorChecksum = \".*\"$/let fragmentcolorChecksum = \"${CHECKSUM}\"/" Package.swift

      - name: Delete the release branch
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          BRANCH="release/v$VERSION"
          BRANCH_SHA=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          if [ -z "$BRANCH_SHA" ]; then echo "No $BRANCH branch to delete."; exit 0; fi
          TAG_SHA=$(git rev-parse "v$VERSION^{commit}")
          if [ "$BRANCH_SHA" != "$TAG_SHA" ]; then
            echo "::warning::$BRANCH ($BRANCH_SHA) is not the v$VERSION commit ($TAG_SHA). Leaving it in place."
            exit 0
          fi
          git push origin --delete "$BRANCH"

      - name: Compute next range and bump dependencies
        id: bump
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          MAJOR="${VERSION%%.*}"
          if [ -z "$MAJOR" ]; then echo "Could not parse major from VERSION=$VERSION" >&2; exit 1; fi
          if [ "$MAJOR" -eq 0 ]; then NEXT="1.0.0"; else NEXT="$((MAJOR+1)).0.0"; fi
          RANGE=">=$VERSION <$NEXT"
          echo "range=$RANGE" >> "$GITHUB_OUTPUT"

          # Update docs/website dependency range
          if [ -f docs/website/package.json ]; then
            tmp=$(mktemp)
            jq --arg r "$RANGE" '.dependencies.fragmentcolor = $r' docs/website/package.json > "$tmp" && mv "$tmp" docs/website/package.json
          fi
          # Update examples/javascript dependency range
          if [ -f examples/javascript/package.json ]; then
            tmp=$(mktemp)
            jq --arg r "$RANGE" '.dependencies.fragmentcolor = $r' examples/javascript/package.json > "$tmp" && mv "$tmp" examples/javascript/package.json
          fi

          # Update examples/python requirement floor (parallels the JS example)
          if [ -f examples/python/requirements.txt ]; then
            sed -i -E "s/^(fragmentcolor>=)[0-9]+\.[0-9]+\.[0-9]+.*/\1${VERSION}/" examples/python/requirements.txt
          fi

          # Update the Kotlin / Maven install snippet shown in the docs
          if [ -f docs/website/src/components/Examples.mdx ]; then
            sed -i -E "s/(org\.fragmentcolor:fragmentcolor:)[0-9]+\.[0-9]+\.[0-9]+/\1${VERSION}/" docs/website/src/components/Examples.mdx
          fi

          # Update VersionBadge.astro if present
          if [ -f docs/website/src/components/VersionBadge.astro ]; then
            sed -i "s/^const VERSION = '.*';$/const VERSION = '${VERSION}';/" docs/website/src/components/VersionBadge.astro || true
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: |
            docs/website/pnpm-lock.yaml
            examples/javascript/pnpm-lock.yaml

      - name: Refresh lockfiles
        run: |
          if [ -f docs/website/package.json ]; then
            pnpm --dir docs/website install --no-frozen-lockfile
          fi
          if [ -f examples/javascript/package.json ]; then
            pnpm --dir examples/javascript install --no-frozen-lockfile
          fi

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: bump consumers to v${{ steps.vars.outputs.version }}"
          title: "chore: bump consumers to v${{ steps.vars.outputs.version }}"
          body: |
            Bump FragmentColor consumers to v${{ steps.vars.outputs.version }}.
            - docs/website package.json: fragmentcolor ${{ steps.bump.outputs.range }}
            - examples/javascript package.json: fragmentcolor ${{ steps.bump.outputs.range }}
            - examples/python requirements.txt: fragmentcolor>=${{ steps.vars.outputs.version }}
            - docs Examples.mdx: Kotlin/Maven snippet pinned to ${{ steps.vars.outputs.version }}
            - VersionBadge.astro updated
            - Package.swift: pin copied from the v${{ steps.vars.outputs.version }} tag (xcframework checksum ${{ steps.swift_pin.outputs.checksum }})
          branch: "chore/bump-consumers-v${{ steps.vars.outputs.version }}"
          labels: chore
          signoff: false
          add-paths: |
            docs/website/package.json
            docs/website/pnpm-lock.yaml
            docs/website/src/components/VersionBadge.astro
            docs/website/src/components/Examples.mdx
            examples/javascript/package.json
            examples/javascript/pnpm-lock.yaml
            examples/python/requirements.txt
            Package.swift
