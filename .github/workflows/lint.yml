name: Lint

# Every pull request lints, whatever it changes: linting needs no build, so it
# stays cheap. The healthchecks and Rust builds keep their paths filters.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install actionlint
        uses: taiki-e/install-action@v2
        with:
          tool: actionlint

      # actionlint runs shellcheck, which the runner image ships, on every run: block.
      - name: Workflows
        run: actionlint -color

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          cache: false

      - name: Format
        run: cargo fmt --all --check --message-format human
