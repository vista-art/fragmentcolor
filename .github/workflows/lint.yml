name: Lint

# Every pull request lints, whatever it changes: linting needs no build, so it
# stays cheap. The healthchecks and Rust builds keep their paths filters.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # The release's own download script, pinned to the version the workflows were checked with.
      - name: Install actionlint
        id: actionlint
        run: bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12

      # actionlint runs shellcheck, which the runner image ships, on every run: block.
      - name: Workflows
        run: ${{ steps.actionlint.outputs.executable }} -color

      # A Mac runs the tools with bash 3.2, which in a UTF-8 locale reads a non-ASCII
      # byte right after an unbraced $NAME as part of the name. Shellcheck misses it.
      - name: Shell scripts
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # Perl expands the variables in its own program.
          git ls-files -z -- fc tools '*.sh' | xargs -0 perl -ne '
            $sh = /^#!.*\b(ba)?sh\b/ || $ARGV =~ /\.sh$/ if $. == 1;
            if ($sh && /\$[A-Za-z_][A-Za-z0-9_]*[^\x00-\x7F]/) {
              print "::error file=$ARGV,line=$.::Brace the variable before the non-ASCII character, as in \${PORT}…\n";
              $bad = 1;
            }
            close ARGV if eof;
            END { exit 1 if $bad }'

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
          cache: false

      - name: Format
        run: cargo fmt --all --check --message-format human
