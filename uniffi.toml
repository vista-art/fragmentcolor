# The crate's own uniffi config. uniffi-bindgen finds it at the crate root in library mode,
# so the build tools pass no --config, which takes a global file of another layout.

[bindings.swift]
module_name = "FragmentColor"

[bindings.kotlin]
package_name = "org.fragmentcolor"
android = true
android_cleaner = true
generate_immutable_records = true
